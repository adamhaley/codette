<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AH Media.ai</title>
    <meta name="description" content="AH Media.ai" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="site-brand" href="/">AH Media</a>
          <nav class="site-nav" aria-label="Primary">
            
          </nav>
        </div>
      </header>
      <main>
        <section class="section hero-section" id="top">
      <div class="container hero-grid hero-grid-solo">
        <div class="hero-copy">
          <p class="eyebrow"></p>
          <h1 class="display-title">AH Media<span class="text-accent">.ai</span></h1>
          <p class="lede"></p>
          
        </div>
        
      </div>
    </section>
      </main>
      <footer class="site-footer">
        <div class="container footer-inner">
          <div>
            <p class="footer-brand">AH Media</p>
            <p class="footer-copy"></p>
          </div>
          <div class="footer-links">
            
          </div>
        </div>
      </footer>
      <div class="chat-widget">
      <div class="chat-container">
        <button class="chat-close-button" type="button" aria-label="Close chat"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l12 12M16 4 4 16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
        <div class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" placeholder="Type your message..." />
          <button class="chat-send-button" type="button" aria-label="Send message"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10 18 2l-5 16-3-6-6-2Z"/></svg></button>
        </div>
      </div>
      <button class="chat-reopen-button" type="button" aria-label="Open chat"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 3h16v10H7l-4 4V13H2V3Z"/></svg></button>
    </div>
    </div>
    
    <script src="/scripts.js"></script>
  </body>
</html>
